apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - gatewayclass.yaml
  - gateway.yaml
helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.9.0
    releaseName: envoy-gateway
    namespace: envoy-gateway-system
    includeCRDs: true
