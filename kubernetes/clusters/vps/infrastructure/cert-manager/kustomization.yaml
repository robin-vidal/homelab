apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - clusterissuer.yaml
  - certificate.yaml
generators:
  - secrets/ksops.yaml
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.21.1
    releaseName: cert-manager
    namespace: cert-manager
    valuesFile: values.yaml
