apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelable-data
  namespace: homelable
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: homelable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/pouzor/homelable-backend:3.4.2
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homelable-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: homelable
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
