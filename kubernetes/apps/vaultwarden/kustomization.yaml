apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - db.yaml
  - httproute.yaml
generators:
  - secrets/ksops.yaml
helmCharts:
  - name: vaultwarden
    repo: https://guerzon.github.io/vaultwarden/
    version: 0.46.1
    releaseName: vaultwarden
    namespace: vaultwarden
    valuesFile: values.yaml
