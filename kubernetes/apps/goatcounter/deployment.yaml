apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goatcounter-data
  namespace: goatcounter
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goatcounter
  namespace: goatcounter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: goatcounter
  template:
    metadata:
      labels:
        app: goatcounter
    spec:
      containers:
        - name: goatcounter
          image: arp242/goatcounter:2.7.0
          args: ["serve", "-automigrate"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: goatcounter-db-app
                  key: uri
            # GoatCounter wants "<driver>+<connstring>", not the bare CNPG uri.
            - name: GOATCOUNTER_DB
              value: "postgresql+$(DATABASE_URL)"
            - name: GOATCOUNTER_LISTEN
              value: ":8080"
            # TLS is terminated by the gateway, but links are generated for :443.
            - name: GOATCOUNTER_TLS
              value: "http"
            - name: GOATCOUNTER_PUBLIC_PORT
              value: "443"
          volumeMounts:
            - name: data
              mountPath: /home/goatcounter/goatcounter-data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: goatcounter-data
---
apiVersion: v1
kind: Service
metadata:
  name: goatcounter
  namespace: goatcounter
spec:
  selector:
    app: goatcounter
  ports:
    - port: 8080
      targetPort: http
