apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - httproute.yaml
generators:
  - secrets/ksops.yaml
helmCharts:
  - name: app-template
    repo: https://bjw-s-labs.github.io/helm-charts
    version: 5.1.0
    releaseName: jellyfin
    namespace: jellyfin
    valuesFile: values.yaml
