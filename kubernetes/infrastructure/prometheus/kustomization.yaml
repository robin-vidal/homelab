apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - httproute.yaml
  - securitypolicy.yaml
generators:
  - secrets/ksops.yaml
helmCharts:
  - name: prometheus
    repo: https://prometheus-community.github.io/helm-charts
    version: 27.4.0
    releaseName: prometheus
    namespace: monitoring
    valuesFile: values.yaml
